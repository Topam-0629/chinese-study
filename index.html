<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중국어 2·4·6과</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e1dc;--acc:#c8372d;--ok:#1f8a4c;--warn:#c27c0e;--bad:#c8372d;--tag:#efece6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--ink:#f1f1f3;--sub:#a0a0a8;--line:#36363c;--acc:#ff6b5e;--ok:#4cc27e;--warn:#e7a73a;--bad:#ff6b5e;--tag:#2d2d33}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--ink:#f1f1f3;--sub:#a0a0a8;--line:#36363c;--acc:#ff6b5e;--ok:#4cc27e;--warn:#e7a73a;--bad:#ff6b5e;--tag:#2d2d33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","PingFang SC",sans-serif;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:15px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:14px;color:var(--sub);margin-bottom:12px}
.bar label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.bar select,.bar button{font:inherit;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{background:var(--tag);color:var(--sub);font-size:12px;padding:2px 8px;border-radius:6px}
.tag.s{color:var(--warn)}
.ko{font-size:34px;font-weight:700;word-break:keep-all}
.ko.sm{font-size:26px}
.hint{font-size:14px;color:var(--sub)}
.py{font-size:52px;font-weight:700;letter-spacing:.5px;color:var(--acc)}
.py.sm{font-size:30px}
.hz{font-size:30px}
.hz.sm{font-size:24px}
input.ans{font-size:26px;padding:10px 14px;width:min(520px,100%);text-align:center;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input.ans:focus{border-color:var(--ink)}
.res{font-size:18px;font-weight:700;min-height:27px}
.res.ok{color:var(--ok)}.res.warn{color:var(--warn)}.res.bad{color:var(--bad)}
.keys{font-size:13px;color:var(--sub);margin-top:10px;text-align:center}
kbd{background:var(--tag);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-family:inherit;font-size:12px}
.prog{font-size:14px;color:var(--sub);text-align:center;margin:8px 0}
.orig{font-size:14px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--tag);font-size:13px;color:var(--sub)}
td.big{font-size:22px}
td.p{color:var(--acc);font-weight:700;white-space:nowrap}
h2{font-size:20px;margin:22px 0 8px}
h3{font-size:17px;margin:18px 0 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:10px 0}
.box p{margin:6px 0}
.ex{font-size:17px}.ex .zh{font-size:19px}.ex .pp{color:var(--acc)}
.list .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0}
.list .row .a{display:none;margin-top:6px}
.list.show .row .a{display:block}
.formula{font-size:17px;font-weight:700;background:var(--tag);padding:8px 12px;border-radius:10px;display:inline-block}
.hide{display:none!important}
.done{font-size:22px;font-weight:700}
.tbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tb{font:inherit;font-size:18px;font-weight:700;padding:14px 22px;min-width:110px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
.tb.g{background:var(--ok);color:#fff;border-color:var(--ok)}.tb.r{background:var(--bad);color:#fff;border-color:var(--bad)}
.tb:active{transform:scale(.97)}
@media (max-width:600px){.ko{font-size:26px}.py{font-size:38px}.card{padding:20px 14px}}
</style>
</head>

/* ===================== 병음 채점 ===================== */
const MARK={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function addTone(s,t){
  if(!t||t>4) return s;
  let i=-1;
  if(s.includes('a')) i=s.indexOf('a');
  else if(s.includes('e')) i=s.indexOf('e');
  else if(s.includes('ou')) i=s.indexOf('o');
  else { for(let k=s.length-1;k>=0;k--){ if('aeiouü'.includes(s[k])){i=k;break;} } }
  if(i<0) return s;
  return s.slice(0,i)+MARK[s[i]][t-1]+s.slice(i+1);
}
function norm(x){
  x=x.normalize('NFC').toLowerCase().replace(/u:|v/g,'ü');
  x=x.replace(/([a-zü]+?)([0-5])/g,(m,s,t)=>addTone(s,+t));
  return x.replace(/[^a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g,'');
}
function bare(x){ return norm(x).normalize('NFD').replace(/[̀-ͯ]/g,''); }
function grade(user,ans){
  if(!user.trim()) return 'bad';
  if(norm(user)===norm(ans)) return 'ok';
  if(bare(user)===bare(ans)) return 'tone';
  return 'bad';
}

/* ===================== 공용 퀴즈 엔진 ===================== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function Quiz(root,opt){
  // items: {prompt, tags[], hint, answer, show(html after reveal)}
  const st={items:[],pos:0,checked:false,ok:0,bad:0,wrong:[],mode:'type',strict:true};
  function start(items,mode,strict){
    st.items=items;st.pos=0;st.ok=0;st.bad=0;st.wrong=[];st.checked=false;st.mode=mode;st.strict=strict;st.flipped=false;render();
  }
  function cur(){return st.items[st.pos];}
  function render(){
    if(!st.items.length){root.innerHTML='<div class="card"><div class="hint">선택된 항목이 없어요.</div></div>';return;}
    if(st.pos>=st.items.length){
      root.innerHTML=`<div class="card"><div class="done">끝! 맞음 ${st.ok} · 틀림 ${st.bad}</div>
      ${st.wrong.length?`<div class="hint">틀린 것 ${st.wrong.length}개: ${st.wrong.map(w=>esc(w.short||w.prompt)).join(', ')}</div>`:''}
      <div class="tbs">${st.wrong.length?'<button class="tb r" data-k="r">틀린 것만 다시</button>':''}<button class="tb" data-k="Enter">처음부터</button></div></div>`;
      return;
    }
    const it=cur();
    const tags=it.tags.map(t=>`<span class="tag ${t.c||''}">${esc(t.t)}</span>`).join('');
    let body=`<div class="tags">${tags}</div><div class="ko">${esc(it.prompt)}</div>${it.hint?`<div class="hint">${esc(it.hint)}</div>`:''}`;
    if(st.mode==='type'){
      body+=`<input class="ans" id="${opt.id}-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="병음 입력 (예: xiang3 / xiǎng)">`;
      body+=`<div class="res" id="${opt.id}-res"></div><div id="${opt.id}-show"></div>`;
    } else {
      body+=`<div id="${opt.id}-show"></div>`;
    }
    root.innerHTML=`<div class="prog">${st.pos+1} / ${st.items.length} · 맞음 ${st.ok} · 틀림 ${st.bad}</div><div class="card">${body}</div>
    <div class="keys">${st.mode==='type'
      ?'<kbd>Enter</kbd> 채점 → <kbd>Enter</kbd> 다음 · <kbd>Esc</kbd> 모르겠음(정답 보기)'
      :'<kbd>Space</kbd> 정답 보기 · <kbd>→</kbd> 알았음 · <kbd>←</kbd> 몰랐음'}</div>
    <div class="tbs">${st.mode==='type'
      ?'<button class="tb" data-k="Escape">모르겠음</button><button class="tb g" data-k="Enter">채점 / 다음</button>'
      :'<button class="tb r" data-k="ArrowLeft">몰랐음</button><button class="tb" data-k=" ">정답 보기</button><button class="tb g" data-k="ArrowRight">알았음</button>'}</div>`;
    st.checked=false;st.flipped=false;
    if(st.mode==='type'){const i=document.getElementById(opt.id+'-in');i.focus();}
  }
  function reveal(cls,msg){
    const it=cur();
    document.getElementById(opt.id+'-show').innerHTML=it.show;
    const r=document.getElementById(opt.id+'-res');
    if(r){r.className='res '+cls;r.textContent=msg;}
  }
  function check(giveUp){
    const it=cur();const inp=document.getElementById(opt.id+'-in');
    let g=giveUp?'bad':grade(inp.value,it.answer);
    if(g==='tone' && !st.strict) g='ok';
    if(g==='ok'){st.ok++;reveal('ok','정답!');}
    else if(g==='tone'){st.bad++;st.wrong.push(it);reveal('warn','성조 틀림 ✗');}
    else {st.bad++;st.wrong.push(it);reveal('bad',giveUp?'정답 확인':'오답 ✗');}
    st.checked=true;inp.readOnly=true;
  }
  function next(){st.pos++;render();}
  function key(e){
    if(st.pos>=st.items.length){
      if(e.key==='r'||e.key==='R'){e.preventDefault();if(st.wrong.length)start(shuffle(st.wrong),st.mode,st.strict);}
      else if(e.key==='Enter'){e.preventDefault();opt.restart();}
      return;
    }
    if(!st.items.length) return;
    if(st.mode==='type'){
      if(e.key==='Enter'){e.preventDefault();if(!st.checked)check(false);else next();}
      else if(e.key==='Escape'){e.preventDefault();if(!st.checked)check(true);}
    } else {
      if(e.key===' '){e.preventDefault();if(!st.flipped){reveal();st.flipped=true;}}
      else if(e.key==='ArrowRight'){e.preventDefault();if(!st.flipped){reveal();st.flipped=true;return;}st.ok++;next();}
      else if(e.key==='ArrowLeft'){e.preventDefault();if(!st.flipped){reveal();st.flipped=true;return;}st.bad++;st.wrong.push(cur());next();}
    }
  }
  return {start,key};
}
